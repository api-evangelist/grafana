}

type SLOFreeformQuery {
  query: String!
}

type SLORatioQuery {
  groupByLabels: [String!]
  successMetric: SLOMetricDef!
  totalMetric: SLOMetricDef!
}

type SLOMetricDef {
  prometheusMetric: String!
  type: String
}

type SLOThresholdQuery {
  groupByLabels: [String!]
  metric: SLOMetricDef!
  thresholdExpression: String!
}

type SLOAlerting {
  fastBurn: SLOAlertCondition
  slowBurn: SLOAlertCondition
  annotations: [LabelEntry!]
  labels: [LabelEntry!]
}

type SLOAlertCondition {
  burnRateAlertingRules: [BurnRateAlertingRule!]!
}

type BurnRateAlertingRule {
  burnRateThreshold: Float!
  for: Duration!
}

type FolderRef {
  uid: String!
}

# ─── Incident ─────────────────────────────────────────────────────────────────

"""A Grafana Incident record."""
type Incident {
  incidentID: String!
  title: String!
  description: String
  severity: IncidentSeverity!
  status: IncidentStatus!
  labels: [LabelEntry!]
  createdTime: DateTime!
  modifiedTime: DateTime!
  closedTime: DateTime
  createdByUser: IncidentUser
  incidentStart: DateTime
  incidentEnd: DateTime
  isDrill: Boolean!
  taskList: IncidentTaskList
}

type IncidentUser {
  userID: String!
  name: String!
  photoURL: String
}

type IncidentTaskList {
  tasks: [IncidentTask!]!
  todoCount: Int!
  doneCount: Int!
}

type IncidentTask {
  taskID: String!
  title: String!
  status: String!
  assignedUser: IncidentUser
  createdTime: DateTime!
  modifiedTime: DateTime!
  immutable: Boolean!
}

# ─── OnCall ───────────────────────────────────────────────────────────────────

"""An on-call schedule configuration."""
type OnCall {
  id: String!
  teamId: String!
  name: String!
  type: String!
  timeZone: String!
  slack: OnCallSlackConfig
  ical: OnCallICalConfig
  shifts: [String!]
}

type OnCallSlackConfig {
  channelId: String!
  userGroupId: String
}

type OnCallICalConfig {
  icalUrlPrimary: String!
  icalUrlOverrides: String
}

"""An escalation chain for routing alerts to on-call responders."""
type EscalationChain {
  id: String!
  name: String!
  teamId: String!
  steps: [EscalationStep!]
}

type EscalationStep {
  id: String!
  escalationPolicyId: String!
  order: Int!
  type: String!
  duration: Int
  personsList: [String!]
  notifyOnCallFromSchedule: String
  groupToNotify: String
  actionToTrigger: String
  important: Boolean
}

"""An alerting integration with an external system in Grafana OnCall."""
type Integration {
  id: String!
  teamId: String!
  name: String!
  link: String!
  incidentsCount: Int!
  type: String!
  defaultRoute: IntegrationRoute
  templates: JSON
}

type IntegrationRoute {
  id: String!
  escalationChainId: String
  slackChannel: SlackChannelRef
  telegram: TelegramChannelRef
  msteams: MsTeamsRef
}

type SlackChannelRef {
  channelId: String!
  enabled: Boolean!
}

type TelegramChannelRef {
  id: String!
  enabled: Boolean!
}

type MsTeamsRef {
  id: String!
  enabled: Boolean!
}

# ─── Root Operations ──────────────────────────────────────────────────────────

type RootQuery {
  health: HealthStatus!
  stats: Stats!

  # Dashboard
  dashboard(uid: String!): Dashboard
  dashboards(query: String, tags: [String!], folderIds: [Int!], limit: Int, page: Int): [SearchResult!]!
  dashboardPermissions(uid: String!): [DashboardPermission!]!

  # Folder
  folder(uid: String!): Folder
  folders(limit: Int, page: Int): [Folder!]!
  folderPermissions(uid: String!): [FolderPermission!]!

  # DataSource
  dataSource(uid: String!): DataSource
  dataSources: [DataSource!]!
  dataSourceByName(name: String!): DataSource

  # Annotation
  annotations(from: Float, to: Float, dashboardUID: String, panelId: Int, tags: [String!], limit: Int): [Annotation!]!

  # Alert
  alertRules(folderUID: String, ruleGroup: String): [AlertRule!]!
  alertRule(uid: String!): AlertRule
  alertInstances(state: AlertState): [AlertInstance!]!
  alertGroups(datasource: String): [AlertGroup!]!
  alertContacts: [AlertContact!]!
  notificationPolicy: Notification

  # User
  currentUser: User!
  user(id: Int!): User
  users(query: String, limit: Int, page: Int): [User!]!

  # Organization
  currentOrg: Organization!
  org(id: Int!): Organization
  orgs: [Organization!]!

  # Team
  team(id: Int!): Team
  teams(query: String, limit: Int, page: Int): [Team!]!

  # Service Account
  serviceAccount(id: Int!): ServiceAccount
  serviceAccounts(query: String, disabled: Boolean): [ServiceAccount!]!
  serviceAccountTokens(serviceAccountId: Int!): [Token!]!

  # RBAC
  role(uid: String!): Role
  roles: [Role!]!
  userRoles(userId: Int!): [Role!]!
  teamRoles(teamId: Int!): [Role!]!

  # Playlist
  playlist(uid: String!): Playlist
  playlists(query: String, limit: Int): [Playlist!]!

  # Library Panel
  libraryPanel(uid: String!): LibraryPanel
  libraryPanels(searchString: String, kind: Int, typeFilter: String, folderFilterUID: String): [LibraryPanel!]!

  # Snapshot
  snapshot(key: String!): Snapshot
  snapshots(query: String, limit: Int): [Snapshot!]!

  # Correlation
  correlation(uid: String!, sourceUID: String!): CorrelationConfig
  correlations(sourceUID: String): [CorrelationConfig!]!

  # Plugin
  pluginSettings(pluginId: String!): PluginSettings
  plugins: [PluginSettings!]!

  # Report
  report(id: Int!): Report
  reports: [Report!]!

  # Public Dashboard
  publicDashboard(uid: String!): PublicDashboard
  publicDashboards: [PublicDashboard!]!

  # SLO
  slo(uuid: String!): SLO
  slos: [SLO!]!

  # Incident
  incident(incidentID: String!): Incident
  incidents(status: IncidentStatus, severity: IncidentSeverity, limit: Int): [Incident!]!

  # OnCall
  onCallSchedule(id: String!): OnCall
  onCallSchedules: [OnCall!]!
  escalationChain(id: String!): EscalationChain
  escalationChains: [EscalationChain!]!
  integration(id: String!): Integration
  integrations: [Integration!]!
}

type Mutation {
  # Dashboard
  createDashboard(dashboard: JSON!, folderId: Int, folderUid: String, overwrite: Boolean): Dashboard!
  updateDashboard(dashboard: JSON!, folderId: Int, folderUid: String, overwrite: Boolean): Dashboard!
  deleteDashboard(uid: String!): Boolean!
  starDashboard(uid: String!): Boolean!
  unstarDashboard(uid: String!): Boolean!

  # Folder
  createFolder(title: String!, uid: String): Folder!
  updateFolder(uid: String!, title: String!): Folder!
  deleteFolder(uid: String!): Boolean!

  # DataSource
  createDataSource(name: String!, type: DatasourceType!, url: String!, access: String!, jsonData: JSON): DataSource!
  updateDataSource(id: Int!, name: String, url: String, jsonData: JSON): DataSource!
  deleteDataSource(id: Int!): Boolean!

  # Annotation
  createAnnotation(dashboardUID: String, panelId: Int, time: Float!, timeEnd: Float, text: String!, tags: [String!]): Annotation!
  updateAnnotation(id: Int!, text: String, tags: [String!]): Annotation!
  deleteAnnotation(id: Int!): Boolean!

  # Alert
  createAlertRule(rule: JSON!): AlertRule!
  updateAlertRule(uid: String!, rule: JSON!): AlertRule!
  deleteAlertRule(uid: String!): Boolean!
  pauseAlertRule(uid: String!, isPaused: Boolean!): AlertRule!

  # User
  createUser(name: String!, email: String!, login: String!, password: String!): User!
  updateUser(id: Int!, name: String, email: String, login: String): User!
  deleteUser(id: Int!): Boolean!

  # Team
  createTeam(name: String!, email: String): Team!
  updateTeam(id: Int!, name: String!, email: String): Team!
  deleteTeam(id: Int!): Boolean!
  addTeamMember(teamId: Int!, userId: Int!): Boolean!
  removeTeamMember(teamId: Int!, userId: Int!): Boolean!

  # Service Account
  createServiceAccount(name: String!, role: OrgRole!, isDisabled: Boolean): ServiceAccount!
  updateServiceAccount(id: Int!, name: String, role: OrgRole, isDisabled: Boolean): ServiceAccount!
  deleteServiceAccount(id: Int!): Boolean!
  createServiceAccountToken(serviceAccountId: Int!, name: String!, secondsToLive: Int): Token!
  deleteServiceAccountToken(serviceAccountId: Int!, tokenId: Int!): Boolean!

  # Playlist
  createPlaylist(name: String!, interval: String!, items: [JSON!]!): Playlist!
  updatePlaylist(uid: String!, name: String!, interval: String!, items: [JSON!]!): Playlist!
  deletePlaylist(uid: String!): Boolean!

  # Snapshot
  createSnapshot(dashboard: JSON!, name: String, expires: Int): Snapshot!
  deleteSnapshot(key: String!): Boolean!

  # Correlation
  createCorrelation(sourceUID: String!, targetUID: String!, label: String, description: String, config: JSON): CorrelationConfig!
  updateCorrelation(uid: String!, sourceUID: String!, label: String, description: String, config: JSON): CorrelationConfig!
  deleteCorrelation(uid: String!, sourceUID: String!): Boolean!

  # Public Dashboard
  createPublicDashboard(dashboardUid: String!, isEnabled: Boolean!, annotationsEnabled: Boolean!, timeSelectionEnabled: Boolean!): PublicDashboard!
  updatePublicDashboard(uid: String!, dashboardUid: String!, isEnabled: Boolean, annotationsEnabled: Boolean, timeSelectionEnabled: Boolean): PublicDashboard!
  deletePublicDashboard(uid: String!, dashboardUid: String!): Boolean!
}

schema {
  query: RootQuery
  mutation: Mutation
}
