naftiko: 1.0.0-alpha2
info:
  label: Grafana — Address
  description: 'Grafana — Address. 2 operations. Lead operation: Grafana Update Current Org Address. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Address
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-address
    baseUri: http://{defaultHost}
    description: Grafana — Address business capability. Self-contained, no shared references.
    resources:
    - name: org-address
      path: /org/address
      operations:
      - name: updatecurrentorgaddress
        method: PUT
        description: Grafana Update Current Org Address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: orgs-org_id-address
      path: /orgs/{org_id}/address
      operations:
      - name: updateorgaddress
        method: PUT
        description: Grafana Update Org Address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-address-rest
    port: 8080
    description: REST adapter for Grafana — Address. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/org/address
      name: org-address
      description: REST surface for org-address.
      operations:
      - method: PUT
        name: updatecurrentorgaddress
        description: Grafana Update Current Org Address
        call: grafana-address.updatecurrentorgaddress
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orgs/{org-id}/address
      name: orgs-org-id-address
      description: REST surface for orgs-org_id-address.
      operations:
      - method: PUT
        name: updateorgaddress
        description: Grafana Update Org Address
        call: grafana-address.updateorgaddress
        with:
          org_id: rest.org_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-address-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Address. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-update-current-org-address
      description: Grafana Update Current Org Address
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-address.updatecurrentorgaddress
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-update-org-address
      description: Grafana Update Org Address
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-address.updateorgaddress
      with:
        org_id: tools.org_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
