naftiko: 1.0.0-alpha2
info:
  label: Grafana — Render
  description: 'Grafana — Render. 2 operations. Lead operation: Grafana Render Report CS Vs. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Render
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-render
    baseUri: http://{defaultHost}
    description: Grafana — Render business capability. Self-contained, no shared references.
    resources:
    - name: reports-render-csvs
      path: /reports/render/csvs
      operations:
      - name: renderreportcsvs
        method: GET
        description: Grafana Render Report CS Vs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dashboards
          in: query
          type: string
        - name: title
          in: query
          type: string
    - name: reports-render-pdfs
      path: /reports/render/pdfs
      operations:
      - name: renderreportpdfs
        method: GET
        description: Grafana Render Report PD Fs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dashboards
          in: query
          type: string
        - name: orientation
          in: query
          type: string
        - name: layout
          in: query
          type: string
        - name: title
          in: query
          type: string
        - name: scaleFactor
          in: query
          type: string
        - name: includeTables
          in: query
          type: string
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-render-rest
    port: 8080
    description: REST adapter for Grafana — Render. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/reports/render/csvs
      name: reports-render-csvs
      description: REST surface for reports-render-csvs.
      operations:
      - method: GET
        name: renderreportcsvs
        description: Grafana Render Report CS Vs
        call: grafana-render.renderreportcsvs
        with:
          dashboards: rest.dashboards
          title: rest.title
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports/render/pdfs
      name: reports-render-pdfs
      description: REST surface for reports-render-pdfs.
      operations:
      - method: GET
        name: renderreportpdfs
        description: Grafana Render Report PD Fs
        call: grafana-render.renderreportpdfs
        with:
          dashboards: rest.dashboards
          orientation: rest.orientation
          layout: rest.layout
          title: rest.title
          scaleFactor: rest.scaleFactor
          includeTables: rest.includeTables
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-render-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Render. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-render-report-cs-vs
      description: Grafana Render Report CS Vs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-render.renderreportcsvs
      with:
        dashboards: tools.dashboards
        title: tools.title
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-render-report-pd-fs
      description: Grafana Render Report PD Fs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-render.renderreportpdfs
      with:
        dashboards: tools.dashboards
        orientation: tools.orientation
        layout: tools.layout
        title: tools.title
        scaleFactor: tools.scaleFactor
        includeTables: tools.includeTables
      outputParameters:
      - type: object
        mapping: $.
