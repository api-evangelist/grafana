    namespace: grafana-reload-rest
    port: 8080
    description: REST adapter for Grafana — Reload. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/admin/ldap/reload
      name: admin-ldap-reload
      description: REST surface for admin-ldap-reload.
      operations:
      - method: POST
        name: reloadldapcfg
        description: Grafana Reload LDAP Cfg
        call: grafana-reload.reloadldapcfg
        outputParameters:
        - type: object
