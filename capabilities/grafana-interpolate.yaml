naftiko: 1.0.0-alpha2
info:
  label: Grafana — Interpolate
  description: 'Grafana — Interpolate. 1 operations. Lead operation: Grafana Interpolate Dashboard. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Interpolate
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-interpolate
    baseUri: http://{defaultHost}
    description: Grafana — Interpolate business capability. Self-contained, no shared references.
    resources:
    - name: dashboards-interpolate
      path: /dashboards/interpolate
      operations:
      - name: interpolatedashboard
        method: POST
        description: Grafana Interpolate Dashboard
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-interpolate-rest
    port: 8080
    description: REST adapter for Grafana — Interpolate. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/dashboards/interpolate
      name: dashboards-interpolate
      description: REST surface for dashboards-interpolate.
      operations:
      - method: POST
        name: interpolatedashboard
        description: Grafana Interpolate Dashboard
        call: grafana-interpolate.interpolatedashboard
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-interpolate-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Interpolate. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-interpolate-dashboard
      description: Grafana Interpolate Dashboard
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-interpolate.interpolatedashboard
      outputParameters:
      - type: object
        mapping: $.
