      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-alerts.getalertrule
      with:
        uid: tools.uid
      outputParameters:
      - type: object
        mapping: $.
    - name: update-alert-rule
      description: Update alert rule
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-alerts.updatealertrule
      with:
        uid: tools.uid
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-alert-rule
