      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-alerts.getcontactpoints
      outputParameters:
      - type: object
        mapping: $.
    - name: create-contact-point
      description: Create a contact point
      hints:
        readOnly: false
