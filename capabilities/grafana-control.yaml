naftiko: 1.0.0-alpha2
info:
  label: Grafana — Control
  description: 'Grafana — Control. 2 operations. Lead operation: Grafana Get Access Control Status. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Control
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-control
    baseUri: http://{defaultHost}
    description: Grafana — Control business capability. Self-contained, no shared references.
    resources:
    - name: access-control-status
      path: /access-control/status
      operations:
      - name: getaccesscontrolstatus
        method: GET
        description: Grafana Get Access Control Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: admin-provisioning-access-control-reload
      path: /admin/provisioning/access-control/reload
      operations:
      - name: adminprovisioningreloadaccesscontrol
        method: POST
        description: Grafana Admin Provisioning Reload Access Control
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-control-rest
    port: 8080
    description: REST adapter for Grafana — Control. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/access-control/status
      name: access-control-status
      description: REST surface for access-control-status.
      operations:
      - method: GET
        name: getaccesscontrolstatus
        description: Grafana Get Access Control Status
        call: grafana-control.getaccesscontrolstatus
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/admin/provisioning/access-control/reload
      name: admin-provisioning-access-control-reload
      description: REST surface for admin-provisioning-access-control-reload.
      operations:
      - method: POST
        name: adminprovisioningreloadaccesscontrol
        description: Grafana Admin Provisioning Reload Access Control
        call: grafana-control.adminprovisioningreloadaccesscontrol
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-control-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Control. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-get-access-control-status
      description: Grafana Get Access Control Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-control.getaccesscontrolstatus
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-admin-provisioning-reload-access
      description: Grafana Admin Provisioning Reload Access Control
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-control.adminprovisioningreloadaccesscontrol
      outputParameters:
      - type: object
        mapping: $.
