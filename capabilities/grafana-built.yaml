naftiko: 1.0.0-alpha2
info:
  label: Grafana — Built
  description: 'Grafana — Built. 1 operations. Lead operation: Grafana Set Resource Permissions For Built In Role. Self-contained
    Naftiko capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Built
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-built
    baseUri: http://{defaultHost}
    description: Grafana — Built business capability. Self-contained, no shared references.
    resources:
    - name: access-control-resource-resourceID-builtInRoles-builtInRole
      path: /access-control/{resource}/{resourceID}/builtInRoles/{builtInRole}
      operations:
      - name: setresourcepermissionsforbuiltinrole
        method: POST
        description: Grafana Set Resource Permissions For Built In Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resource
          in: path
          type: string
          required: true
        - name: resourceID
          in: path
          type: string
          required: true
        - name: builtInRole
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-built-rest
    port: 8080
    description: REST adapter for Grafana — Built. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/access-control/{resource}/{resourceid}/builtinroles/{builtinrole}
      name: access-control-resource-resourceid-builtinroles-builtinrole
      description: REST surface for access-control-resource-resourceID-builtInRoles-builtInRole.
      operations:
      - method: POST
        name: setresourcepermissionsforbuiltinrole
        description: Grafana Set Resource Permissions For Built In Role
        call: grafana-built.setresourcepermissionsforbuiltinrole
        with:
          resource: rest.resource
          resourceID: rest.resourceID
          builtInRole: rest.builtInRole
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-built-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Built. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-set-resource-permissions-built
      description: Grafana Set Resource Permissions For Built In Role
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-built.setresourcepermissionsforbuiltinrole
      with:
        resource: tools.resource
        resourceID: tools.resourceID
        builtInRole: tools.builtInRole
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
