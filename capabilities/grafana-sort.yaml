naftiko: 1.0.0-alpha2
info:
  label: Grafana — Sort
  description: 'Grafana — Sort. 1 operations. Lead operation: Grafana List Sort Options. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Sort
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-sort
    baseUri: http://{defaultHost}
    description: Grafana — Sort business capability. Self-contained, no shared references.
    resources:
    - name: search-sorting
      path: /search/sorting
      operations:
      - name: listsortoptions
        method: GET
        description: Grafana List Sort Options
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-sort-rest
    port: 8080
    description: REST adapter for Grafana — Sort. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/search/sorting
      name: search-sorting
      description: REST surface for search-sorting.
      operations:
      - method: GET
        name: listsortoptions
        description: Grafana List Sort Options
        call: grafana-sort.listsortoptions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-sort-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Sort. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-list-sort-options
      description: Grafana List Sort Options
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-sort.listsortoptions
      outputParameters:
      - type: object
        mapping: $.
