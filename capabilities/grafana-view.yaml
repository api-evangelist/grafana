naftiko: 1.0.0-alpha2
info:
  label: Grafana — View
  description: 'Grafana — View. 1 operations. Lead operation: Grafana View Public Dashboard. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - View
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-view
    baseUri: http://{defaultHost}
    description: Grafana — View business capability. Self-contained, no shared references.
    resources:
    - name: public-dashboards-accessToken
      path: /public/dashboards/{accessToken}
      operations:
      - name: viewpublicdashboard
        method: GET
        description: Grafana View Public Dashboard
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accessToken
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-view-rest
    port: 8080
    description: REST adapter for Grafana — View. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/public/dashboards/{accesstoken}
      name: public-dashboards-accesstoken
      description: REST surface for public-dashboards-accessToken.
      operations:
      - method: GET
        name: viewpublicdashboard
        description: Grafana View Public Dashboard
        call: grafana-view.viewpublicdashboard
        with:
          accessToken: rest.accessToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-view-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — View. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-view-public-dashboard
      description: Grafana View Public Dashboard
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-view.viewpublicdashboard
      with:
        accessToken: tools.accessToken
      outputParameters:
      - type: object
        mapping: $.
