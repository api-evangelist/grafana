    baseUri: http://{defaultHost}
    description: Grafana — Queries business capability. Self-contained, no shared references.
    resources:
    - name: ds-query
      path: /ds/query
      operations:
      - name: querymetricswithexpressions
        method: POST
        description: Grafana Query Metrics With Expressions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: public-dashboards-accessToken-panels-panelId-query
      path: /public/dashboards/{accessToken}/panels/{panelId}/query
      operations:
      - name: querypublicdashboard
        method: POST
        description: Grafana Query Public Dashboard
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accessToken
          in: path
          type: string
          required: true
        - name: panelId
          in: path
          type: integer
          required: true
    - name: query-history
      path: /query-history
      operations:
      - name: searchqueries
        method: GET
        description: Grafana Search Queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: datasourceUid
          in: query
          type: array
          description: List of data source UIDs to search for
        - name: searchString
          in: query
          type: string
          description: Text inside query or comments that is searched for
        - name: onlyStarred
          in: query
          type: boolean
          description: Flag indicating if only starred queries should be returned
        - name: sort
          in: query
          type: string
          description: Sort method
        - name: page
          in: query
          type: integer
          description: Use this parameter to access hits beyond limit. Numbering starts at 1. limit param acts as page size.
        - name: limit
          in: query
          type: integer
          description: Limit the number of returned results
        - name: from
          in: query
          type: integer
          description: From range for the query history search
        - name: to
          in: query
          type: integer
          description: To range for the query history search
      - name: createquery
        method: POST
        description: Grafana Create Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: query-history-star-query_history_uid
      path: /query-history/star/{query_history_uid}
      operations:
      - name: starquery
        method: POST
        description: Grafana Star Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query_history_uid
          in: path
          type: string
          required: true
      - name: unstarquery
        method: DELETE
        description: Grafana Unstar Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query_history_uid
          in: path
          type: string
          required: true
    - name: query-history-query_history_uid
      path: /query-history/{query_history_uid}
      operations:
      - name: deletequery
        method: DELETE
        description: Grafana Delete Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query_history_uid
          in: path
          type: string
          required: true
      - name: patchquerycomment
        method: PATCH
        description: Grafana Patch Query Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query_history_uid
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
