naftiko: 1.0.0-alpha2
info:
  label: Grafana — Description
  description: 'Grafana — Description. 1 operations. Lead operation: Grafana Get Resource Description. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Description
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-description
    baseUri: http://{defaultHost}
    description: Grafana — Description business capability. Self-contained, no shared references.
    resources:
    - name: access-control-resource-description
      path: /access-control/{resource}/description
      operations:
      - name: getresourcedescription
        method: GET
        description: Grafana Get Resource Description
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resource
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-description-rest
    port: 8080
    description: REST adapter for Grafana — Description. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/access-control/{resource}/description
      name: access-control-resource-description
      description: REST surface for access-control-resource-description.
      operations:
      - method: GET
        name: getresourcedescription
        description: Grafana Get Resource Description
        call: grafana-description.getresourcedescription
        with:
          resource: rest.resource
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-description-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Description. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-get-resource-description
      description: Grafana Get Resource Description
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-description.getresourcedescription
      with:
        resource: tools.resource
      outputParameters:
      - type: object
        mapping: $.
