naftiko: 1.0.0-alpha2
info:
  label: Grafana — Member
  description: 'Grafana — Member. 3 operations. Lead operation: Grafana Add Team Member. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Member
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-member
    baseUri: http://{defaultHost}
    description: Grafana — Member business capability. Self-contained, no shared references.
    resources:
    - name: teams-team_id-members
      path: /teams/{team_id}/members
      operations:
      - name: addteammember
        method: POST
        description: Grafana Add Team Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: teams-team_id-members-user_id
      path: /teams/{team_id}/members/{user_id}
      operations:
      - name: updateteammember
        method: PUT
        description: Grafana Update Team Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          required: true
        - name: user_id
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: removeteammember
        method: DELETE
        description: Grafana Remove Team Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          required: true
        - name: user_id
          in: path
          type: integer
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-member-rest
    port: 8080
    description: REST adapter for Grafana — Member. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/teams/{team-id}/members
      name: teams-team-id-members
      description: REST surface for teams-team_id-members.
      operations:
      - method: POST
        name: addteammember
        description: Grafana Add Team Member
        call: grafana-member.addteammember
        with:
          team_id: rest.team_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{team-id}/members/{user-id}
      name: teams-team-id-members-user-id
      description: REST surface for teams-team_id-members-user_id.
      operations:
      - method: PUT
        name: updateteammember
        description: Grafana Update Team Member
        call: grafana-member.updateteammember
        with:
          team_id: rest.team_id
          user_id: rest.user_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removeteammember
        description: Grafana Remove Team Member
        call: grafana-member.removeteammember
        with:
          team_id: rest.team_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-member-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Member. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-add-team-member
      description: Grafana Add Team Member
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-member.addteammember
      with:
        team_id: tools.team_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-update-team-member
      description: Grafana Update Team Member
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-member.updateteammember
      with:
        team_id: tools.team_id
        user_id: tools.user_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-remove-team-member
      description: Grafana Remove Team Member
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: grafana-member.removeteammember
      with:
        team_id: tools.team_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
