naftiko: 1.0.0-alpha2
info:
  label: Grafana — Invites
  description: 'Grafana — Invites. 3 operations. Lead operation: Grafana Get Pending Org Invites. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Invites
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-invites
    baseUri: http://{defaultHost}
    description: Grafana — Invites business capability. Self-contained, no shared references.
    resources:
    - name: org-invites
      path: /org/invites
      operations:
      - name: getpendingorginvites
        method: GET
        description: Grafana Get Pending Org Invites
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addorginvite
        method: POST
        description: Grafana Add Org Invite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: org-invites-invitation_code-revoke
      path: /org/invites/{invitation_code}/revoke
      operations:
      - name: revokeinvite
        method: DELETE
        description: Grafana Revoke Invite
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: invitation_code
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-invites-rest
    port: 8080
    description: REST adapter for Grafana — Invites. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/org/invites
      name: org-invites
      description: REST surface for org-invites.
      operations:
      - method: GET
        name: getpendingorginvites
        description: Grafana Get Pending Org Invites
        call: grafana-invites.getpendingorginvites
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addorginvite
        description: Grafana Add Org Invite
        call: grafana-invites.addorginvite
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/org/invites/{invitation-code}/revoke
      name: org-invites-invitation-code-revoke
      description: REST surface for org-invites-invitation_code-revoke.
      operations:
      - method: DELETE
        name: revokeinvite
        description: Grafana Revoke Invite
        call: grafana-invites.revokeinvite
        with:
          invitation_code: rest.invitation_code
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-invites-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Invites. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-get-pending-org-invites
      description: Grafana Get Pending Org Invites
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-invites.getpendingorginvites
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-add-org-invite
      description: Grafana Add Org Invite
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-invites.addorginvite
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-revoke-invite
      description: Grafana Revoke Invite
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: grafana-invites.revokeinvite
      with:
        invitation_code: tools.invitation_code
      outputParameters:
      - type: object
        mapping: $.
