naftiko: 1.0.0-alpha2
info:
  label: Grafana — Password
  description: 'Grafana — Password. 2 operations. Lead operation: Grafana Admin Update User Password. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Password
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-password
    baseUri: http://{defaultHost}
    description: Grafana — Password business capability. Self-contained, no shared references.
    resources:
    - name: admin-users-user_id-password
      path: /admin/users/{user_id}/password
      operations:
      - name: adminupdateuserpassword
        method: PUT
        description: Grafana Admin Update User Password
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: user-password
      path: /user/password
      operations:
      - name: changeuserpassword
        method: PUT
        description: Grafana Change User Password
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-password-rest
    port: 8080
    description: REST adapter for Grafana — Password. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/admin/users/{user-id}/password
      name: admin-users-user-id-password
      description: REST surface for admin-users-user_id-password.
      operations:
      - method: PUT
        name: adminupdateuserpassword
        description: Grafana Admin Update User Password
        call: grafana-password.adminupdateuserpassword
        with:
          user_id: rest.user_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/user/password
      name: user-password
      description: REST surface for user-password.
      operations:
      - method: PUT
        name: changeuserpassword
        description: Grafana Change User Password
        call: grafana-password.changeuserpassword
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-password-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Password. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-admin-update-user-password
      description: Grafana Admin Update User Password
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-password.adminupdateuserpassword
      with:
        user_id: tools.user_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-change-user-password
      description: Grafana Change User Password
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-password.changeuserpassword
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
