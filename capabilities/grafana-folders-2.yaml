        idempotent: true
      call: grafana-folders-2.deletefolder
      with:
        folder_uid: tools.folder_uid
        forceDeleteRules: tools.forceDeleteRules
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-get-folder-descendant-counts
      description: Grafana Get Folder Descendant Counts
