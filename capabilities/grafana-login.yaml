naftiko: 1.0.0-alpha2
info:
  label: Grafana — Login
  description: 'Grafana — Login. 1 operations. Lead operation: Grafana Get User By Login Or Email. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Login
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-login
    baseUri: http://{defaultHost}
    description: Grafana — Login business capability. Self-contained, no shared references.
    resources:
    - name: users-lookup
      path: /users/lookup
      operations:
      - name: getuserbyloginoremail
        method: GET
        description: Grafana Get User By Login Or Email
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: loginOrEmail
          in: query
          type: string
          description: loginOrEmail of the user
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-login-rest
    port: 8080
    description: REST adapter for Grafana — Login. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/users/lookup
      name: users-lookup
      description: REST surface for users-lookup.
      operations:
      - method: GET
        name: getuserbyloginoremail
        description: Grafana Get User By Login Or Email
        call: grafana-login.getuserbyloginoremail
        with:
          loginOrEmail: rest.loginOrEmail
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-login-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Login. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-get-user-login-email
      description: Grafana Get User By Login Or Email
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-login.getuserbyloginoremail
      with:
        loginOrEmail: tools.loginOrEmail
      outputParameters:
      - type: object
        mapping: $.
