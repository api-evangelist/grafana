  - type: http
    namespace: grafana-reports
    baseUri: http://{defaultHost}
    description: Grafana — Reports business capability. Self-contained, no shared references.
    resources:
    - name: licensing-custom-permissions
      path: /licensing/custom-permissions
      operations:
      - name: getcustompermissionsreport
        method: GET
        description: Grafana Get Custom Permissions Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports
      path: /reports
      operations:
      - name: getreports
        method: GET
        description: Grafana Get Reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createreport
        method: POST
        description: Grafana Create Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: reports-dashboards-uid
      path: /reports/dashboards/{uid}
      operations:
      - name: getreportsbydashboarduid
        method: GET
        description: Grafana Get Reports By Dashboard UID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uid
          in: path
          type: string
          required: true
    - name: reports-email
      path: /reports/email
      operations:
      - name: sendreport
        method: POST
        description: Grafana Send Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: reports-render-csvs
      path: /reports/render/csvs
      operations:
      - name: renderreportcsvs
        method: GET
        description: Grafana Render Report CS Vs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dashboards
          in: query
          type: string
        - name: title
          in: query
          type: string
    - name: reports-render-pdfs
      path: /reports/render/pdfs
      operations:
      - name: renderreportpdfs
        method: GET
        description: Grafana Render Report PD Fs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dashboards
          in: query
          type: string
        - name: orientation
          in: query
          type: string
        - name: layout
          in: query
          type: string
        - name: title
          in: query
          type: string
        - name: scaleFactor
          in: query
          type: string
        - name: includeTables
          in: query
          type: string
    - name: reports-settings
      path: /reports/settings
      operations:
      - name: getreportsettings
        method: GET
        description: Grafana Get Report Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: savereportsettings
        method: POST
        description: Grafana Save Report Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: reports-id
      path: /reports/{id}
      operations:
      - name: getreport
        method: GET
        description: Grafana Get Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
      - name: updatereport
        method: PUT
        description: Grafana Update Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletereport
        method: DELETE
        description: Grafana Delete Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
