naftiko: 1.0.0-alpha2
info:
  label: Grafana — Send
  description: 'Grafana — Send. 2 operations. Lead operation: Grafana Send Report. Self-contained Naftiko capability covering
    one Grafana business surface.'
  tags:
  - Grafana
  - Send
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-send
    baseUri: http://{defaultHost}
    description: Grafana — Send business capability. Self-contained, no shared references.
    resources:
    - name: reports-email
      path: /reports/email
      operations:
      - name: sendreport
        method: POST
        description: Grafana Send Report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: reports-test-email
      path: /reports/test-email
      operations:
      - name: sendtestemail
        method: POST
        description: Grafana Send Test Email
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-send-rest
    port: 8080
    description: REST adapter for Grafana — Send. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/reports/email
      name: reports-email
      description: REST surface for reports-email.
      operations:
      - method: POST
        name: sendreport
        description: Grafana Send Report
        call: grafana-send.sendreport
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports/test-email
      name: reports-test-email
      description: REST surface for reports-test-email.
      operations:
      - method: POST
        name: sendtestemail
        description: Grafana Send Test Email
        call: grafana-send.sendtestemail
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-send-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Send. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-send-report
      description: Grafana Send Report
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-send.sendreport
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-send-test-email
      description: Grafana Send Test Email
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: grafana-send.sendtestemail
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
