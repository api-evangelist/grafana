naftiko: 1.0.0-alpha2
info:
  label: Grafana — Sessions
  description: 'Grafana — Sessions. 4 operations. Lead operation: Grafana Get Session List. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-sessions
    baseUri: http://{defaultHost}
    description: Grafana — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: cloudmigration-migration
      path: /cloudmigration/migration
      operations:
      - name: getsessionlist
        method: GET
        description: Grafana Get Session List
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsession
        method: POST
        description: Grafana Create Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: cloudmigration-migration-uid
      path: /cloudmigration/migration/{uid}
      operations:
      - name: getsession
        method: GET
        description: Grafana Get Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uid
          in: path
          type: string
          description: UID of a migration session
          required: true
      - name: deletesession
        method: DELETE
        description: Grafana Delete Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uid
          in: path
          type: string
          description: UID of a migration session
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-sessions-rest
    port: 8080
    description: REST adapter for Grafana — Sessions. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/cloudmigration/migration
      name: cloudmigration-migration
      description: REST surface for cloudmigration-migration.
      operations:
      - method: GET
        name: getsessionlist
        description: Grafana Get Session List
        call: grafana-sessions.getsessionlist
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsession
        description: Grafana Create Session
        call: grafana-sessions.createsession
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cloudmigration/migration/{uid}
      name: cloudmigration-migration-uid
      description: REST surface for cloudmigration-migration-uid.
      operations:
      - method: GET
        name: getsession
        description: Grafana Get Session
        call: grafana-sessions.getsession
        with:
          uid: rest.uid
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesession
        description: Grafana Delete Session
        call: grafana-sessions.deletesession
        with:
          uid: rest.uid
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Sessions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-get-session-list
      description: Grafana Get Session List
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-sessions.getsessionlist
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-create-session
      description: Grafana Create Session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-sessions.createsession
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-get-session
      description: Grafana Get Session
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-sessions.getsession
      with:
        uid: tools.uid
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-delete-session
      description: Grafana Delete Session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: grafana-sessions.deletesession
      with:
        uid: tools.uid
      outputParameters:
      - type: object
        mapping: $.
