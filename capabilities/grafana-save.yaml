naftiko: 1.0.0-alpha2
info:
  label: Grafana — Save
  description: 'Grafana — Save. 1 operations. Lead operation: Grafana Save Report Settings. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Save
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-save
    baseUri: http://{defaultHost}
    description: Grafana — Save business capability. Self-contained, no shared references.
    resources:
    - name: reports-settings
      path: /reports/settings
      operations:
      - name: savereportsettings
        method: POST
        description: Grafana Save Report Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-save-rest
    port: 8080
    description: REST adapter for Grafana — Save. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/reports/settings
      name: reports-settings
      description: REST surface for reports-settings.
      operations:
      - method: POST
        name: savereportsettings
        description: Grafana Save Report Settings
        call: grafana-save.savereportsettings
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-save-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Save. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-save-report-settings
      description: Grafana Save Report Settings
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-save.savereportsettings
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
