      path: /datasources/uid/{sourceUID}/correlations
      operations:
      - name: createcorrelation
        method: POST
        description: Grafana Create Correlation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sourceUID
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: datasources-uid-sourceUID-correlations-correlationUID
      path: /datasources/uid/{sourceUID}/correlations/{correlationUID}
      operations:
      - name: getcorrelation
        method: GET
        description: Grafana Get Correlation
