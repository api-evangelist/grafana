naftiko: 1.0.0-alpha2
info:
  label: Grafana — Settings
  description: 'Grafana — Settings. 8 operations. Lead operation: Grafana Admin Get Settings. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-settings
    baseUri: http://{defaultHost}
    description: Grafana — Settings business capability. Self-contained, no shared references.
    resources:
    - name: admin-settings
      path: /admin/settings
      operations:
      - name: admingetsettings
        method: GET
        description: Grafana Admin Get Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports-images-:image
      path: /reports/images/:image
      operations:
      - name: getsettingsimage
        method: GET
        description: Grafana Get Settings Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports-settings
      path: /reports/settings
      operations:
      - name: getreportsettings
        method: GET
        description: Grafana Get Report Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: savereportsettings
        method: POST
        description: Grafana Save Report Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-sso-settings
      path: /v1/sso-settings
      operations:
      - name: listallproviderssettings
        method: GET
        description: Grafana List All Providers Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-sso-settings-key
      path: /v1/sso-settings/{key}
      operations:
      - name: getprovidersettings
        method: GET
        description: Grafana Get Provider Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: path
          type: string
          required: true
      - name: updateprovidersettings
        method: PUT
        description: Grafana Update Provider Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: removeprovidersettings
        method: DELETE
        description: Grafana Remove Provider Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-settings-rest
    port: 8080
    description: REST adapter for Grafana — Settings. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/admin/settings
      name: admin-settings
      description: REST surface for admin-settings.
      operations:
      - method: GET
        name: admingetsettings
        description: Grafana Admin Get Settings
        call: grafana-settings.admingetsettings
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports/images/image
      name: reports-images-image
      description: REST surface for reports-images-:image.
      operations:
      - method: GET
        name: getsettingsimage
        description: Grafana Get Settings Image
        call: grafana-settings.getsettingsimage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports/settings
      name: reports-settings
      description: REST surface for reports-settings.
      operations:
      - method: GET
        name: getreportsettings
        description: Grafana Get Report Settings
        call: grafana-settings.getreportsettings
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: savereportsettings
        description: Grafana Save Report Settings
        call: grafana-settings.savereportsettings
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/sso-settings
      name: v1-sso-settings
      description: REST surface for v1-sso-settings.
      operations:
      - method: GET
        name: listallproviderssettings
        description: Grafana List All Providers Settings
        call: grafana-settings.listallproviderssettings
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/sso-settings/{key}
      name: v1-sso-settings-key
      description: REST surface for v1-sso-settings-key.
      operations:
      - method: GET
        name: getprovidersettings
        description: Grafana Get Provider Settings
        call: grafana-settings.getprovidersettings
        with:
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateprovidersettings
        description: Grafana Update Provider Settings
        call: grafana-settings.updateprovidersettings
        with:
          key: rest.key
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removeprovidersettings
        description: Grafana Remove Provider Settings
        call: grafana-settings.removeprovidersettings
        with:
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
