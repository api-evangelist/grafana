    port: 9090
    transport: http
    description: MCP adapter for Grafana — Settings. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-admin-get-settings
      description: Grafana Admin Get Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-settings.admingetsettings
      outputParameters:
