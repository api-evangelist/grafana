naftiko: 1.0.0-alpha2
info:
  label: Grafana — Memberships
  description: 'Grafana — Memberships. 1 operations. Lead operation: Grafana Set Team Memberships. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Memberships
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-memberships
    baseUri: http://{defaultHost}
    description: Grafana — Memberships business capability. Self-contained, no shared references.
    resources:
    - name: teams-team_id-members
      path: /teams/{team_id}/members
      operations:
      - name: setteammemberships
        method: PUT
        description: Grafana Set Team Memberships
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-memberships-rest
    port: 8080
    description: REST adapter for Grafana — Memberships. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams/{team-id}/members
      name: teams-team-id-members
      description: REST surface for teams-team_id-members.
      operations:
      - method: PUT
        name: setteammemberships
        description: Grafana Set Team Memberships
        call: grafana-memberships.setteammemberships
        with:
          team_id: rest.team_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-memberships-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Memberships. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-set-team-memberships
      description: Grafana Set Team Memberships
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: grafana-memberships.setteammemberships
      with:
        team_id: tools.team_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
