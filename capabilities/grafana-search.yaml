      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-search.searchorgusers
      with:
        org_id: tools.org_id
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-search-playlists
      description: Grafana Search Playlists
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-search.searchplaylists
      with:
        query: tools.query
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-search-queries
      description: Grafana Search Queries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-search.searchqueries
      with:
        datasourceUid: tools.datasourceUid
        searchString: tools.searchString
        onlyStarred: tools.onlyStarred
        sort: tools.sort
        page: tools.page
        limit: tools.limit
        from: tools.from
        to: tools.to
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-search
      description: Grafana Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-search.search
      with:
        query: tools.query
        tag: tools.tag
        type: tools.type
        dashboardIds: tools.dashboardIds
        dashboardUIDs: tools.dashboardUIDs
        folderIds: tools.folderIds
        folderUIDs: tools.folderUIDs
        starred: tools.starred
        limit: tools.limit
        page: tools.page
        permission: tools.permission
        sort: tools.sort
        deleted: tools.deleted
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-search-org-service-accounts
