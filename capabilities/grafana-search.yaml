    - name: grafana-search-teams
      description: Grafana Search Teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-search.searchteams
      with:
        page: tools.page
        perpage: tools.perpage
        name: tools.name
        query: tools.query
        accesscontrol: tools.accesscontrol
        sort: tools.sort
      outputParameters:
      - type: object
        mapping: $.
    - name: grafana-search-team-groups
      description: Grafana Search Team Groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-search.searchteamgroups
      with:
        teamId: tools.teamId
        page: tools.page
        perpage: tools.perpage
        query: tools.query
        name: tools.name
      outputParameters:
      - type: object
