naftiko: 1.0.0-alpha2
info:
  label: Grafana — Mass
  description: 'Grafana — Mass. 1 operations. Lead operation: Grafana Mass Delete Annotations. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Mass
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-mass
    baseUri: http://{defaultHost}
    description: Grafana — Mass business capability. Self-contained, no shared references.
    resources:
    - name: annotations-mass-delete
      path: /annotations/mass-delete
      operations:
      - name: massdeleteannotations
        method: POST
        description: Grafana Mass Delete Annotations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-mass-rest
    port: 8080
    description: REST adapter for Grafana — Mass. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/annotations/mass-delete
      name: annotations-mass-delete
      description: REST surface for annotations-mass-delete.
      operations:
      - method: POST
        name: massdeleteannotations
        description: Grafana Mass Delete Annotations
        call: grafana-mass.massdeleteannotations
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-mass-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Mass. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-mass-delete-annotations
      description: Grafana Mass Delete Annotations
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: grafana-mass.massdeleteannotations
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
