naftiko: 1.0.0-alpha2
info:
  label: Grafana — Flags
  description: 'Grafana — Flags. 1 operations. Lead operation: Grafana Clear Help Flags. Self-contained Naftiko capability
    covering one Grafana business surface.'
  tags:
  - Grafana
  - Flags
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-flags
    baseUri: http://{defaultHost}
    description: Grafana — Flags business capability. Self-contained, no shared references.
    resources:
    - name: user-helpflags-clear
      path: /user/helpflags/clear
      operations:
      - name: clearhelpflags
        method: GET
        description: Grafana Clear Help Flags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-flags-rest
    port: 8080
    description: REST adapter for Grafana — Flags. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/user/helpflags/clear
      name: user-helpflags-clear
      description: REST surface for user-helpflags-clear.
      operations:
      - method: GET
        name: clearhelpflags
        description: Grafana Clear Help Flags
        call: grafana-flags.clearhelpflags
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-flags-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Flags. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-clear-help-flags
      description: Grafana Clear Help Flags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-flags.clearhelpflags
      outputParameters:
      - type: object
        mapping: $.
