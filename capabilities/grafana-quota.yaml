    resources:
    - name: admin-users-user_id-quotas
      path: /admin/users/{user_id}/quotas
      operations:
      - name: getuserquota
        method: GET
        description: Grafana Get User Quota
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: integer
          required: true
    - name: admin-users-user_id-quotas-quota_target
      path: /admin/users/{user_id}/quotas/{quota_target}
      operations:
      - name: updateuserquota
        method: PUT
        description: Grafana Update User Quota
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: quota_target
          in: path
          type: string
          required: true
        - name: user_id
          in: path
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: org-quotas
      path: /org/quotas
      operations:
      - name: getcurrentorgquota
        method: GET
        description: Grafana Get Current Org Quota
        outputRawFormat: json
        outputParameters:
