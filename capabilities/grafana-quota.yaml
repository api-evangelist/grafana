naftiko: 1.0.0-alpha2
info:
  label: Grafana — Quota
  description: 'Grafana — Quota. 5 operations. Lead operation: Grafana Get User Quota. Self-contained Naftiko capability covering
    one Grafana business surface.'
  tags:
  - Grafana
  - Quota
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
