      - name: getorgquota
        method: GET
        description: Grafana Get Org Quota
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: org_id
          in: path
          type: integer
          required: true
    - name: orgs-org_id-quotas-quota_target
      path: /orgs/{org_id}/quotas/{quota_target}
      operations:
      - name: updateorgquota
        method: PUT
        description: Grafana Update Org Quota
        outputRawFormat: json
        outputParameters:
        - name: result
