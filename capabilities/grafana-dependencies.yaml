naftiko: 1.0.0-alpha2
info:
  label: Grafana — Dependencies
  description: 'Grafana — Dependencies. 1 operations. Lead operation: Grafana Get Resource Dependencies. Self-contained Naftiko
    capability covering one Grafana business surface.'
  tags:
  - Grafana
  - Dependencies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRAFANA_API_KEY: GRAFANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: grafana-dependencies
    baseUri: http://{defaultHost}
    description: Grafana — Dependencies business capability. Self-contained, no shared references.
    resources:
    - name: cloudmigration-resources-dependencies
      path: /cloudmigration/resources/dependencies
      operations:
      - name: getresourcedependencies
        method: GET
        description: Grafana Get Resource Dependencies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.GRAFANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: grafana-dependencies-rest
    port: 8080
    description: REST adapter for Grafana — Dependencies. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/cloudmigration/resources/dependencies
      name: cloudmigration-resources-dependencies
      description: REST surface for cloudmigration-resources-dependencies.
      operations:
      - method: GET
        name: getresourcedependencies
        description: Grafana Get Resource Dependencies
        call: grafana-dependencies.getresourcedependencies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: grafana-dependencies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Grafana — Dependencies. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: grafana-get-resource-dependencies
      description: Grafana Get Resource Dependencies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: grafana-dependencies.getresourcedependencies
      outputParameters:
      - type: object
        mapping: $.
