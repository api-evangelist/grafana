clis:
- name: grafanactl
  official: true
  status: deprecated
  repo: https://github.com/grafana/grafanactl
  docs: https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/
  home: https://grafana.github.io/grafanactl/
  description: >-
    The Grafana CLI for managing Grafana resources as code across OSS, Enterprise and Cloud —
    authenticate, manage multiple environments (contexts), and drive the Grafana REST API from
    the terminal. Repo archived 2026-06-01; migrate to gcx (search-and-replace grafanactl -> gcx).
  install_methods:
  - go install github.com/grafana/grafanactl/cmd/grafanactl@latest
  - Homebrew / release binaries (see docs/installation.md)
  - Docker
  config:
    env_vars: [GRAFANA_SERVER, GRAFANA_TOKEN, GRAFANA_STACK_ID, GRAFANA_ORG_ID]
    config_file: multi-context config for switching between Grafana instances
  command_surface:
  - group: config
    summary: Manage CLI contexts (environments) and check connectivity (config check).
  - group: resources
    summary: pull / push / serve / edit / delete / list Grafana resources (dashboards, folders, datasources, ...) as code.
  - group: dashboards
    summary: Work with dashboards specifically (get, render).
  successor:
  - name: gcx
    note: Grafana is consolidating grafanactl learnings into the new gcx CLI (grafanactl resources serve -> gcx dev serve).
- name: grafana-cli
  official: true
  status: active
  docs: https://grafana.com/docs/grafana/latest/cli/
  description: >-
    The server-side admin CLI bundled with a self-hosted Grafana binary. Manages plugins and
    administrative tasks on a Grafana instance (not the REST-as-code tool).
  command_surface:
  - group: plugins
    summary: install / list-remote / update / update-all / remove Grafana plugins.
  - group: admin
    summary: reset-admin-password, data-migration, secrets-migration and other server admin tasks.
