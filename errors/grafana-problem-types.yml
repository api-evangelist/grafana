- status: 404
  title: Not Found
  meaning: The referenced resource (dashboard, folder, datasource, user, team, org) does not exist.
  remediation: Verify the uid/id; the resource may have been deleted or belong to another org.
  source_operation: openapi/grafana-api.yml (NotFound response)
- status: 409
  title: Conflict
  meaning: Resource already exists or a version conflict (e.g. dashboard saved with a stale version).
  remediation: Use overwrite=true or re-fetch the current version before saving.
- status: 412
  title: Precondition Failed
  meaning: A version/precondition check failed on save (dashboard optimistic concurrency).
  remediation: Re-read the resource, merge changes, and retry with the current version.
- status: 500
  title: Internal Server Error
  meaning: Unexpected server-side error.
  remediation: Retry with backoff; check Grafana server logs and status.grafana.com.
