  description: RESTful API for managing Grafana resources including dashboards, data
    sources, alert rules, users, organizations, folders, annotations, and teams. Supports
    authentication via API keys, basic auth, and OAuth tokens.
  humanURL: https://grafana.com/docs/grafana/latest/developers/http_api/
  baseURL: http://localhost:3000/api
