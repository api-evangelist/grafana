aid: grafana
name: Grafana
description: Grafana is the open-source analytics and monitoring platform that connects
  to a wide range of data sources including Prometheus, Loki, Elasticsearch, InfluxDB,
  MySQL, PostgreSQL, and cloud providers. It provides a comprehensive HTTP API for
  managing dashboards, data sources, alert rules, users, organizations, folders, annotations,
  and teams.
