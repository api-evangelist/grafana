name: Grafana
description: >-
  Grafana is the open-source analytics and monitoring platform that connects
  to a wide range of data sources including Prometheus, Loki, Elasticsearch,
  InfluxDB, MySQL, PostgreSQL, and cloud providers. It provides a comprehensive
  HTTP API for managing dashboards, data sources, alert rules, users,
  organizations, folders, annotations, and teams.
url: https://grafana.com
tags:
- Observability
- Monitoring
- Dashboards
- Visualization
- Alerting
- Analytics
- Metrics
- Logs
- Traces
created: '2025'
modified: '2025'
apis:
- name: Grafana HTTP API
  description: >-
    RESTful API for managing Grafana resources including dashboards, data
    sources, alert rules, users, organizations, folders, annotations, and
    teams. Supports authentication via API keys, basic auth, and OAuth tokens.
  baseUrl: http://localhost:3000/api
  tags:
  - Dashboards
  - Data Sources
  - Alerts
  - Users
  - Organizations
  - Folders
  - Annotations
  - Teams
  properties:
  - type: OpenAPI
    url: openapi/grafana-api.yml
  - type: JSONSchema
    url: json-schema/dashboard.json
  - type: JSONSchema
    url: json-schema/panel.json
  - type: JSONSchema
    url: json-schema/datasource.json
  - type: JSONLD
    url: json-ld/grafana-context.jsonld
  - type: Documentation
    url: https://grafana.com/docs/grafana/latest/developers/http_api/
  - type: GitHubRepository
    url: https://github.com/grafana/grafana
common: []
