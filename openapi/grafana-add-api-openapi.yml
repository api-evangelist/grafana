components:
  schemas:
    createOrUpdateDatasourceResponse:
      title: createOrUpdateDatasourceResponse
      required:
      - datasource
      - id
      - message
      - name
      type: object
      properties:
        datasource:
          $ref: '#/components/schemas/DataSource'
        id:
          type: integer
          description: ID Identifier of the new data source.
          contentEncoding: int64
          examples:
          - 65
        message:
          type: string
          description: Message Message of the deleted dashboard.
          examples:
          - Data source added
        name:
          type: string
          description: Name of the new data source.
          examples:
          - My Data source
    AddDataSourceCommand:
      title: AddDataSourceCommand
      type: object
      properties:
        access:
          type: string
        basicAuth:
          type: boolean
        basicAuthUser:
          type: string
        database:
          type: string
        isDefault:
          type: boolean
        jsonData:
          type: object
        name:
          type: string
        secureJsonData:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
        uid:
          type: string
        url:
          type: string
        user:
          type: string
        withCredentials:
          type: boolean
      description: Also acts as api DTO
    Role:
      title: Role
      enum:
      - None
      - Viewer
      - Editor
      - Admin
      type: string
    AddTeamMemberCommand:
      title: AddTeamMemberCommand
      required:
      - userId
      type: object
      properties:
        userId:
          type: integer
          contentEncoding: int64
    DataSource:
      title: DataSource
      type: object
      properties:
        access:
          type: string
        accessControl:
          type: object
          additionalProperties:
            type: boolean
          description: 'Metadata contains user accesses for a given resource

            Ex: map[string]bool{"create":true, "delete": true}'
        basicAuth:
          type: boolean
        basicAuthUser:
          type: string
        database:
          type: string
        id:
          type: integer
          contentEncoding: int64
        isDefault:
          type: boolean
        jsonData:
          type: object
        name:
          type: string
        orgId:
          type: integer
          contentEncoding: int64
        readOnly:
          type: boolean
        secureJsonFields:
          type: object
          additionalProperties:
            type: boolean
        type:
          type: string
        typeLogoUrl:
          type: string
        uid:
          type: string
        url:
          type: string
        user:
          type: string
        version:
          type: integer
          contentEncoding: int64
        withCredentials:
          type: boolean
    AddUserRoleCommand:
      title: AddUserRoleCommand
      type: object
      properties:
        global:
          type: boolean
        roleUid:
          type: string
    TeamGroupMapping:
      title: TeamGroupMapping
      type: object
      properties:
        groupId:
          type: string
    AddInviteForm:
      title: AddInviteForm
      type: object
      properties:
        loginOrEmail:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        sendEmail:
          type: boolean
    SuccessResponseBody:
      title: SuccessResponseBody
      type: object
      properties:
        message:
          type: string
    AddTeamRoleCommand:
      title: AddTeamRoleCommand
      type: object
      properties:
        roleUid:
          type: string
    ErrorResponseBody:
      title: ErrorResponseBody
      required:
      - message
      type: object
      properties:
        error:
          type: string
          description: Error An optional detailed description of the actual error. Only included if running in developer mode.
        message:
          type: string
          description: a human readable version of the error
        status:
          type: string
          description: 'Status An optional status to denote the cause of the error.


            For example, a 412 Precondition Failed error may include additional information of why that error happened.'
    AddOrgUserCommand:
      title: AddOrgUserCommand
      type: object
      properties:
        loginOrEmail:
          type: string
        role:
          $ref: '#/components/schemas/Role'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Service account token or API key
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: Bearer <api-key>'
