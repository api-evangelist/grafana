components:
  schemas:
    resourcePermissionDTO:
      title: resourcePermissionDTO
      type: object
      properties:
        actions:
          type: array
          items:
            type: string
          description: ''
        builtInRole:
          type: string
        id:
          type: integer
          contentEncoding: int64
        isInherited:
          type: boolean
        isManaged:
          type: boolean
        isServiceAccount:
          type: boolean
        permission:
          type: string
        roleName:
          type: string
        team:
          type: string
        teamAvatarUrl:
          type: string
        teamId:
          type: integer
          contentEncoding: int64
        teamUid:
          type: string
        userAvatarUrl:
          type: string
        userId:
          type: integer
          contentEncoding: int64
        userLogin:
          type: string
        userUid:
          type: string
    SetResourcePermissionCommand:
      title: SetResourcePermissionCommand
      type: object
      properties:
        builtInRole:
          type: string
        permission:
          type: string
        teamId:
          type: integer
          contentEncoding: int64
        userId:
          type: integer
          contentEncoding: int64
    Dependency:
      title: Dependency
      enum:
      - DASHBOARD
      - DATASOURCE
      - FOLDER
      - LIBRARY_ELEMENT
      - ALERT_RULE
      - ALERT_RULE_GROUP
      - CONTACT_POINT
      - NOTIFICATION_POLICY
      - NOTIFICATION_TEMPLATE
      - MUTE_TIMING
      - PLUGIN
      type: string
    ResourceDependenciesResponseDTO:
      title: ResourceDependenciesResponseDTO
      type: object
      properties:
        resourceDependencies:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDependencyDTO'
          description: ''
    ResourceType:
      title: ResourceType
      enum:
      - DASHBOARD
      - DATASOURCE
      - FOLDER
      - LIBRARY_ELEMENT
      - ALERT_RULE
      - ALERT_RULE_GROUP
      - CONTACT_POINT
      - NOTIFICATION_POLICY
      - NOTIFICATION_TEMPLATE
      - MUTE_TIMING
      - PLUGIN
      type: string
    setPermissionCommand:
      title: setPermissionCommand
      type: object
      properties:
        permission:
          type: string
    SuccessResponseBody:
      title: SuccessResponseBody
      type: object
      properties:
        message:
          type: string
    ResourceDependencyDTO:
      title: ResourceDependencyDTO
      type: object
      properties:
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
          description: ''
        resourceType:
          $ref: '#/components/schemas/ResourceType'
    ErrorResponseBody:
      title: ErrorResponseBody
      required:
      - message
      type: object
      properties:
        error:
          type: string
          description: Error An optional detailed description of the actual error. Only included if running in developer mode.
        message:
          type: string
          description: a human readable version of the error
        status:
          type: string
          description: 'Status An optional status to denote the cause of the error.


            For example, a 412 Precondition Failed error may include additional information of why that error happened.'
    Description:
      title: Description
      type: object
      properties:
        assignments:
          $ref: '#/components/schemas/Assignments'
        permissions:
          type: array
          items:
            type: string
          description: ''
    Assignments:
      title: Assignments
      type: object
      properties:
        builtInRoles:
          type: boolean
        serviceAccounts:
          type: boolean
        teams:
          type: boolean
        users:
          type: boolean
    setPermissionsCommand:
      title: setPermissionsCommand
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SetResourcePermissionCommand'
          description: ''
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Service account token or API key
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: Bearer <api-key>'
