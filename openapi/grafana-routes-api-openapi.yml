                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: 1 == 1
                hide: false
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
                type: math
              queryType: ''
              refId: A
              relativeTimeRange:
                from: 0
                to: 0
        execErrState:
          $ref: '#/components/schemas/ExecErrState'
        folderUID:
          type: string
          examples:
          - project_x
        for:
          type: string
        id:
          type: integer
          contentEncoding: int64
        isPaused:
          type: boolean
          examples:
          - false
        keep_firing_for:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
          examples:
          - team: sre-team-1
        missingSeriesEvalsToResolve:
          type: integer
          contentEncoding: int64
          examples:
          - 2
        noDataState:
          $ref: '#/components/schemas/NoDataState'
        notification_settings:
          $ref: '#/components/schemas/AlertRuleNotificationSettings'
        orgID:
          type: integer
          contentEncoding: int64
        provenance:
          type: string
        record:
          $ref: '#/components/schemas/Record'
        ruleGroup:
          maxLength: 190
          minLength: 1
          type: string
          examples:
