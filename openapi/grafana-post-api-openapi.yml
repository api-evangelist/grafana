components:
  schemas:
    Type:
      title: Type
      enum:
      - alertmanager
      - dingding
      - discord
      - email
      - googlechat
      - kafka
      - line
      - opsgenie
      - pagerduty
      - pushover
      - sensugo
      - slack
      - teams
      - telegram
      - threema
      - victorops
      - webhook
      - wecom
      type: string
      examples:
      - webhook
    Token:
      title: Token
      type: object
      properties:
        account:
          type: string
        anonymousRatio:
          type: integer
          contentEncoding: int64
        company:
          type: string
        details_url:
          type: string
        exp:
          type: integer
          contentEncoding: int64
        iat:
          type: integer
          contentEncoding: int64
        included_users:
          type: integer
          contentEncoding: int64
        iss:
          type: string
        jti:
          type: string
        lexp:
          type: integer
          contentEncoding: int64
        lic_exp_warn_days:
          type: integer
          contentEncoding: int64
        lid:
          type: string
        limit_by:
          type: string
        max_concurrent_user_sessions:
          type: integer
          contentEncoding: int64
        nbf:
          type: integer
          contentEncoding: int64
        prod:
          type: array
          items:
            type: string
          description: ''
        slug:
          type: string
        status:
          type: integer
          contentEncoding: int64
        sub:
          type: string
        tok_exp_warn_days:
          type: integer
          contentEncoding: int64
        trial:
          type: boolean
        trial_exp:
          type: integer
          contentEncoding: int64
        update_days:
          type: integer
          contentEncoding: int64
        usage_billing:
          type: boolean
    ProvisionedAlertRule:
      title: ProvisionedAlertRule
      required:
      - condition
      - data
      - execErrState
      - folderUID
      - for
      - noDataState
      - orgID
      - ruleGroup
      - title
      type: object
      properties:
        annotations:
          type: object
          additionalProperties:
            type: string
          examples:
          - runbook_url: https://supercoolrunbook.com/page/13
        condition:
          type: string
          examples:
          - A
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlertQueryrepresentsasinglequeryassociatedwithanalertdefinition.'
          description: ''
          examples:
          - - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: 1 == 1
                hide: false
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
                type: math
              queryType: ''
              refId: A
              relativeTimeRange:
                from: 0
                to: 0
        execErrState:
          $ref: '#/components/schemas/ExecErrState'
        folderUID:
          type: string
          examples:
          - project_x
        for:
          type: string
        id:
          type: integer
          contentEncoding: int64
        isPaused:
          type: boolean
          examples:
          - false
        keep_firing_for:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
          examples:
          - team: sre-team-1
        missingSeriesEvalsToResolve:
          type: integer
          contentEncoding: int64
          examples:
          - 2
        noDataState:
          $ref: '#/components/schemas/NoDataState'
        notification_settings:
          $ref: '#/components/schemas/AlertRuleNotificationSettings'
        orgID:
          type: integer
          contentEncoding: int64
        provenance:
          type: string
        record:
          $ref: '#/components/schemas/Record'
        ruleGroup:
          maxLength: 190
          minLength: 1
          type: string
          examples:
          - eval_group_1
        title:
          maxLength: 190
          minLength: 1
          type: string
          examples:
          - Always firing
        uid:
          maxLength: 40
          minLength: 1
          pattern: ^[a-zA-Z0-9-_]+$
          type: string
        updated:
          type: string
          contentEncoding: date-time
          readOnly: true
    ValidationError:
      title: ValidationError
      type: object
      properties:
        message:
          type: string
          examples:
          - error message
    postAnnotationResponse:
      title: postAnnotationResponse
      required:
      - id
      - message
      type: object
      properties:
        id:
          type: integer
          description: ID Identifier of the created annotation.
          contentEncoding: int64
          examples:
          - 65
        message:
          type: string
          description: Message Message of the created annotation.
    ErrorResponseBody:
      title: ErrorResponseBody
      required:
      - message
      type: object
      properties:
        error:
          type: string
          description: Error An optional detailed description of the actual error. Only included if running in developer mode.
        message:
          type: string
          description: a human readable version of the error
        status:
          type: string
          description: 'Status An optional status to denote the cause of the error.


            For example, a 412 Precondition Failed error may include additional information of why that error happened.'
    SaveDashboardCommand:
      title: SaveDashboardCommand
      type: object
      properties:
        UpdatedAt:
          type: string
          contentEncoding: date-time
        dashboard:
          type: object
        folderId:
          type: integer
          description: 'Deprecated: use FolderUID instead'
          contentEncoding: int64
        folderUid:
          type: string
        isFolder:
          type: boolean
        message:
          type: string
        overwrite:
          type: boolean
        userId:
          type: integer
          contentEncoding: int64
    PostGraphiteAnnotationsCmd:
      title: PostGraphiteAnnotationsCmd
      type: object
      properties:
        data:
          type: string
        tags: {}
        what:
          type: string
        when:
          type: integer
          contentEncoding: int64
    EmbeddedContactPoint:
      title: EmbeddedContactPoint
      required:
      - settings
      - type
      type: object
      properties:
        disableResolveMessage:
          type: boolean
          examples:
          - false
        name:
          type: string
          description: 'Name is used as grouping key in the UI. Contact points with the

            same name will be grouped in the UI.'
          examples:
          - webhook_1
        provenance:
          type: string
          readOnly: true
        settings:
          type: object
        type:
          allOf:
          - $ref: '#/components/schemas/Type'
          - examples:
            - webhook
        uid:
          maxLength: 40
          minLength: 1
          pattern: ^[a-zA-Z0-9\-\_]+$
          type: string
          description: 'UID is the unique identifier of the contact point. The UID can be

            set by the user.'
          examples:
          - my_external_reference
      description: 'EmbeddedContactPoint is the contact point type that is used

        by grafanas embedded alertmanager implementation.'
    DeleteTokenCommand:
      title: DeleteTokenCommand
      type: object
      properties:
        instance:
          type: string
    MuteTimeIntervalrepresentsanamedsetoftimeintervalsforwhicharouteshouldbemuted.:
      title: MuteTimeIntervalrepresentsanamedsetoftimeintervalsforwhicharouteshouldbemuted.
      type: object
      properties:
        name:
          type: string
        time_intervals:
          type: array
          items:
            $ref: '#/components/schemas/TimeIntervalrepresentsanamedsetoftimeintervalsforwhicharouteshouldbemuted.'
          description: ''
    AlertRuleNotificationSettings:
      title: AlertRuleNotificationSettings
      required:
      - receiver
      type: object
      properties:
        active_time_intervals:
          type: array
          items:
            type: string
          description: 'Override the times when notifications should not be muted. These must match the name of a mute time interval defined

            in the alertmanager configuration time_intervals section. All notifications will be suppressed unless they are sent

            at the time that matches any interval.'
          examples:
          - - maintenance
        group_by:
          type: array
          items:
            type: string
          description: 'Override the labels by which incoming alerts are grouped together. For example, multiple alerts coming in for

            cluster=A and alertname=LatencyHigh would be batched into a single group. To aggregate by all possible labels

            use the special value ''...'' as the sole label name.

            This effectively disables aggregation entirely, passing through all alerts as-is. This is unlikely to be what

            you want, unless you have a very low alert volume or your upstream notification system performs its own grouping.

            Must include ''alertname'' and ''grafana_folder'' if not using ''...''.'
          default:
          - alertname
          - grafana_folder
          examples:
          - - alertname
            - grafana_folder
            - cluster
        group_interval:
          type: string
          description: 'Override how long to wait before sending a notification about new alerts that are added to a group of alerts for

            which an initial notification has already been sent. (Usually ~5m or more.)'
          examples:
          - 5m
        group_wait:
          type: string
          description: 'Override how long to initially wait to send a notification for a group of alerts. Allows to wait for an

            inhibiting alert to arrive or collect more initial alerts for the same group. (Usually ~0s to few minutes.)'
          examples:
          - 30s
        mute_time_intervals:
          type: array
          items:
            type: string
          description: 'Override the times when notifications should be muted. These must match the name of a mute time interval defined

            in the alertmanager configuration time_intervals section. When muted it will not send any notifications, but

            otherwise acts normally.'
          examples:
          - - maintenance
        receiver:
          type: string
          description: Name of the receiver to send notifications to.
          examples:
          - grafana-default-email
        repeat_interval:
          type: string
          description: 'Override how long to wait before sending a notification again if it has already been sent successfully for an

            alert. (Usually ~3h or more).

            Note that this parameter is implicitly bound by Alertmanager''s `--data.retention` configuration flag.

            Notifications will be resent after either repeat_interval or the data retention period have passed, whichever

            occurs first. `repeat_interval` should not be less than `group_interval`.'
          examples:
          - 4h
    ConvertPrometheusResponse:
      title: ConvertPrometheusResponse
      type: object
      properties:
        error:
          type: string
        errorType:
          type: string
        status:
          type: string
    postDashboardResponse:
      title: postDashboardResponse
      required:
      - id
      - status
      - title
      - uid
      - url
      - version
      type: object
      properties:
        folderUid:
          type: string
          description: FolderUID The unique identifier (uid) of the folder the dashboard belongs to.
        id:
          type: integer
          description: ID The unique identifier (id) of the created/updated dashboard.
          contentEncoding: int64
          examples:
          - 1
        status:
          type: string
          description: Status status of the response.
          examples:
          - success
        title:
          type: string
          description: Slug The slug of the dashboard.
          examples:
          - my-dashboard
        uid:
          type: string
          description: UID The unique identifier (uid) of the created/updated dashboard.
          examples:
          - nHz3SXiiz
        url:
          type: string
          description: URL The relative URL for accessing the created/updated dashboard.
          examples:
          - /d/nHz3SXiiz/my-dashboard
        version:
          type: integer
          description: Version The version of the dashboard.
          contentEncoding: int64
          examples:
          - 2
    PostAnnotationsCmd:
      title: PostAnnotationsCmd
      required:
      - text
      type: object
      properties:
        dashboardId:
          type: integer
          contentEncoding: int64
        dashboardUID:
          type: string
        data:
          type: object
        panelId:
          type: integer
          contentEncoding: int64
        tags:
          type: array
          items:
            type: string
          description: ''
        text:
          type: string
        time:
          type: integer
          contentEncoding: int64
        timeEnd:
          type: integer
          contentEncoding: int64
    NoDataState:
      title: NoDataState
      enum:
      - Alerting
      - NoData
      - OK
      type: string
    RelativeTimeRange:
      title: RelativeTimeRange
      type: object
      properties:
        from:
          type: integer
          description: 'A Duration represents the elapsed time between two instants

